<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142D22"/>
      <stop offset="100%" stop-color="#06100C"/>
    </linearGradient>
    <linearGradient id="leaf" gradientUnits="userSpaceOnUse" x1="120" y1="420" x2="400" y2="110">
      <stop offset="0%" stop-color="#1FAE55"/>
      <stop offset="100%" stop-color="#86F3B2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <!-- stem and roots -->
  <g stroke="url(#leaf)" stroke-width="24" stroke-linecap="round" fill="none">
    <path d="M256 168 V 386"/>
    <path d="M256 386 C 246 412 226 424 200 428"/>
    <path d="M256 386 C 266 412 286 424 312 428"/>
  </g>

  <!-- upper leaf, right -->
  <path d="M262 232 C 262 164 306 120 390 120 C 390 204 344 240 262 240 Z"

<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#F3F6F1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Shikor — smart garden watering, from anywhere.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shikor">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <title>Shikor</title>
  <!-- Apply the saved theme and language before the first paint, so a dark-mode
       user never sees a white flash. Light + English are the defaults. -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var theme = localStorage.getItem('shikor.theme.v1') === 'dark' ? 'dark' : 'light';
        var lang  = localStorage.getItem('shikor.lang.v1')  === 'bn'   ? 'bn'   : 'en';
        root.setAttribute('data-theme', theme);
        root.setAttribute('lang', lang);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0A1310' : '#F3F6F1');
      } catch (e) { /* storage blocked: stay on the light / English defaults */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
